# --- General Settings ---
backend = "glx";
vsync = true;
use-damage = false;
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# --- Disable Animations ---
# Removed the transition block entirely to stop movement delays.

# --- Disable Fading ---
fading = false; # Set to false to make windows appear instantly

# --- Corners (Set to 0 for speed/aesthetic consistency) ---
corner-radius = 0;
round-borders = 0;

# --- Shadows ---
shadow = false;

# --- Opacity & Blur ---
# This section ensures ONLY Kitty (and other specified apps) get transparency/blur
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.0; # Set to 0 to prevent darkening inactive windows

opacity-rule = [
  "90:class_g = 'kitty'",      # Adjust '90' to your preferred transparency level
  "100:class_g = 'firefox'",
  "100:class_g = 'code-oss'"
];

# --- Background Blurring ---
blur: {
  method = "dual_kawase";
  strength = 8;
  background = true;
  background-frame = false;
  background-fixed = false;
}

# This ensures blur only applies to windows that are NOT opaque
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g != 'kitty'",         # This line EXCLUDES everything that is NOT kitty
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Window type settings ---
wintypes:
{
  normal = { fade = false; shadow = false; }
  tooltip = { fade = false; shadow = false; opacity = 1.0; }
  dock = { shadow = false; }
  dnd = { shadow = false; }
};
